<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quotarr</title>
    <meta name="description" content="Search your TV shows by quote and make screencaps, memes and GIFs.">
<!--og-->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand" data-link aria-label="Quotarr home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="8" width="26" height="19" rx="4" fill="var(--accent)"/><rect x="7" y="12" width="18" height="11" rx="2" fill="var(--bg)"/><path d="M11 3l5 5 5-5" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Quotarr</span>
      </a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" name="q" placeholder="Search for a quote…" spellcheck="false" aria-label="Search quotes">
      </form>
      <nav class="nav">
        <button id="random-btn" class="btn ghost" type="button" title="Jump to a random screencap">Random</button>
        <a href="/admin" class="btn ghost" data-link title="Pick shows and watch indexing">Admin</a>
      </nav>
    </header>
    <div id="show-filter" class="show-filter" hidden></div>
    <main id="view" class="view"></main>
    <noscript><p class="empty">Quotarr needs JavaScript.</p></noscript>
  </body>
</html>
